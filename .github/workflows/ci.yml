name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pizza
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client
          until mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Create CI config.js
        run: |
          cat > src/config.js <<'EOF'
          module.exports = {
            jwtSecret: process.env.JWT_SECRET || 'test-secret',
            db: {
              connection: {
                host: process.env.DB_HOST || '127.0.0.1',
                user: process.env.DB_USER || 'root',
                password: process.env.DB_PASSWORD || 'root',
                database: process.env.DB_DATABASE || 'pizza',
                connectTimeout: 60000,
              },
              listPerPage: 10,
            },
            factory: {
              url: process.env.FACTORY_URL || 'https://pizza-factory.cs329.click',
              apiKey: process.env.FACTORY_API_KEY || 'test-api-key',
            },
          };
          EOF

      - name: Initialize database schema
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_DATABASE: pizza
          JWT_SECRET: test-secret
        run: |
          NODE_ENV=development node -e "const { DB } = require('./src/database/database.js'); DB.initializeDatabase().then(()=>{console.log('DB initialized'); process.exit(0);}).catch((e)=>{console.error(e); process.exit(1);});"

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_DATABASE: pizza
          JWT_SECRET: test-secret
        run: npm test